<script id="gps-search-index" type="application/json"><!--@searchindex--></script>
<script>
(function(){
var idx=[];try{idx=JSON.parse(document.getElementById('gps-search-index').textContent);}catch(e){}
var inp=document.getElementById('sq'),out=document.getElementById('srResults'),
    cnt=document.getElementById('srCount'),empty=document.getElementById('srEmpty'),start=document.getElementById('srStart');
function esc(s){return s.replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function mark(s,q){if(!q)return esc(s);var i=s.toLowerCase().indexOf(q);if(i<0)return esc(s);
  return esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+q.length))+'</mark>'+esc(s.slice(i+q.length));}
function run(q){
  q=(q||'').trim().toLowerCase();
  if(!q){out.innerHTML='';cnt.textContent='';empty.style.display='none';start.style.display='';return;}
  start.style.display='none';
  var terms=q.split(/\s+/).filter(Boolean);
  var hits=idx.map(function(p){
    var hay=(p.t+' '+p.s+' '+p.d).toLowerCase();
    var score=0,all=true;
    terms.forEach(function(t){
      if(p.t.toLowerCase().indexOf(t)>=0)score+=10;
      else if(p.s.toLowerCase().indexOf(t)>=0)score+=4;
      else if(hay.indexOf(t)>=0)score+=2;
      else all=false;
    });
    return all?{p:p,score:score}:null;
  }).filter(Boolean).sort(function(a,b){return b.score-a.score;});
  cnt.textContent=hits.length+(hits.length===1?' page':' pages');
  empty.style.display=hits.length?'none':'flex';
  out.innerHTML=hits.map(function(h){
    return '<a class="sr-item" href="'+h.p.u+'"><div class="sr-sec">'+esc(h.p.s)+'</div><h3>'+mark(h.p.t,terms[0])+'</h3><p>'+mark(h.p.d,terms[0])+'</p></a>';
  }).join('');
}
var q=new URLSearchParams(location.search).get('q')||'';
if(q){inp.value=q;}
run(q);
var t=null;
inp.addEventListener('input',function(){clearTimeout(t);t=setTimeout(function(){run(inp.value);},130);});
})();
</script>
